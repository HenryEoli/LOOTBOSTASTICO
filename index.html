<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            background-color: antiquewhite;
            color: black;
            font-family:monospace;
            font-size: 15px;
        }
        table,td,th,tr{
            border: darkslategray 1px solid;
            border-collapse: collapse;
            text-align: left;
        }
        table{
            width: 40%;
        }
        td{
            width: 30%;
        }
        header{
            color: darkslategray;
            top:0%;
            left: 0%;
            height: 10%;
            width: 100%;
            position: fixed;
            text-align: center;
        }
        nav{
            top:10%;
            left: 0%;
            height: 10%;
            width: 100%;
            position: fixed;
            text-align: center;
            margin-left: center;
        }
        main{
            top:20%;
            left: 0%;
            height: 70%;
            width: 100%;
            position: fixed;
            text-align: left;
            padding-left: 5%;
            overflow: auto;
        }
        footer{
            color: darkslategray;
            top:90%;
            left: 0%;
            height: 10%;
            width: 100%;
            position: fixed;
            text-align: center;
        }
        button{
            background-color: darkslategray;
        }
    </style>
    <title>Evento Mouse</title>
</head>
<body>
    
        <header><h1>Evento Mouse</h1></header>

        <nav>

                    <td><button ondblclick="claro()">Claro</button></td>
                    <td><button ondblclick="escuro()">Escuro</button></td>
        </nav>

        <main>
        <Table id="tb">
            <tr>
                <th>LOOTBOX <br> Moedas: <span id="saldo">1000</span> 🪙</th>
            </tr>
            <tr>    
                <td>
                    <img id="resultado" src="img/inte" width="400" height="200">
                    <button onclick="clicke()"><img src="img/3.png" width="200px">
                        <p>-100 MOEDAs</p>
                    </button>
                </td>
            </tr>
            <tr>
                <th>Ganhar Moedas</th>
            </tr>
            <tr>
                <td>
                <button  onmousedown="Spin('img/1.gif')" onmouseup="UnSpin('img/oi.jpg')">
                    <img src="img/oi.jpg" width="200px" id="OIIA">
                </button>
            </td>
            </tr>
        </Table>
        </main>
        <footer>
            <h2>PW III - Henry</h2>
        </footer>
</body>

    <script>

        var moedas = 1000;

    function clicke(){

        if(moedas >= 100){
            
            var numero = Math.floor(Math.random() * 10) + 1;

            document.getElementById("resultado").src = "img/" + numero + ".jpg";    
        
            moedas = moedas - 100
        
            document.getElementById("saldo").innerText = moedas;

            } else {
                alert("Sem moedas, seu BOSTA")
            }
    }
    
    function Spin(path){
        
        document.getElementById("OIIA").src = path;

    }
    
    function UnSpin(path){
        document.getElementById("OIIA").src = path;
    }

    function escuro(){
        document.body.style.backgroundColor="darkslategray";
        document.body.style.color="antiquewhite";

        var celulas = document.querySelectorAll('#tb, td, th, tr');
        celulas.forEach(function(celula){
            celula.style.border = '1px solid antiquewhite';
            celula.style.color = 'antiquewhite';
        })
        var celulas = document.querySelectorAll('footer, header');
        celulas.forEach(function(celula){
            celula.style.color = 'antiquewhite';
        })
        var celulas = document.querySelectorAll('button');
        celulas.forEach(function(celula){
            celula.style.backgroundColor = 'antiquewhite';
        })
    }
    function claro(){
        document.body.style.backgroundColor="antiquewhite";
        document.body.style.color="darkslategray";

        var celulas = document.querySelectorAll('#tb, td, th, tr');
        celulas.forEach(function(celula){
            celula.style.border = '1px solid darkslategray';
            celula.style.color = 'darkslategray';
        })
        var celulas = document.querySelectorAll('footer, header');
        celulas.forEach(function(celula){
            celula.style.color = 'darkslategray';
        })
        var celulas = document.querySelectorAll('button');
        celulas.forEach(function(celula){
            celula.style.backgroundColor = 'darkslategray';
        })
    }


    </script>

</html>
